<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="utf-8">

<title>Microplanejamento Vacinal - Foz do Iguaçu</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
#legenda{

    margin-top:10px;

    background:white;

    padding:6px;

    border-radius:4px;

    font-size:12px;

    color:black;

    max-width:220px;

}

.item-legenda{

    margin-bottom:3px;

}

.cor{

    display:inline-block;

    width:14px;

    height:14px;

    margin-right:5px;

    border:1px solid #333;

}

html, body{
    margin:0;
    height:100%;
}

#map{
    height:100%;
}

#controle{

    position:absolute;

    top:10px;
    left:50px;

    z-index:1000;

    background:rgb(66, 79, 157);

    padding:10px;

    border-radius:5px;

    box-shadow:0 0 5px rgba(0,0,0,0.3);

}

#indicador{

    min-width:220px;

    font-size:14px;

    padding:5px;

}

</style>

</head>

<body>

<div id="controle">

<select id="indicador">
<option>Carregando...</option>
</select>

<div id="legenda"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

// ======================================
// CONFIGURAÇÕES
// ======================================

const csvUrl =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ83nMaB8cLLAZEwAicEhPeiuVPd89zsqMrS4T6-BtLNIYsH7LsU2jafFd4_OIDoULHl0Vv6raOBEG3/pub?gid=1960672355&single=true&output=csv';

const geojsonUrl =
'ubsmicroplanejamentogeojson_clean.geojson';

// ======================================
// MAPA
// ======================================

const map =
L.map('map').setView(
    [-25.54,-54.58],
    11
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap'
}
).addTo(map);

// ======================================
// VARIÁVEIS GLOBAIS
// ======================================

let indicadores = {};

let geojsonData = null;

let camadaUBS = null;

let indicadorAtual = null;

// ======================================
// IDENTIFICAR SE É NUMÉRICO
// ======================================

function ehNumerico(indicador){

    const primeiro =
        Object.values(indicadores)[0];

    if(!primeiro)
        return false;

    const valor =
        primeiro[indicador];

    return !isNaN(
        parseFloat(
            String(valor)
            .replace(",",".")
        )
    );

}

// ======================================
// QUARTIS
// ======================================

function calcularQuartis(indicador){

    let valores = [];

    Object.values(indicadores)
    .forEach(row => {

        let valor =
            parseFloat(
                String(
                    row[indicador]
                ).replace(",",".")
            );

        if(!isNaN(valor))
            valores.push(valor);

    });

    valores.sort(
        (a,b)=>a-b
    );

    return {

        q1:
        valores[
            Math.floor(
                valores.length * 0.25
            )
        ],

        q2:
        valores[
            Math.floor(
                valores.length * 0.50
            )
        ],

        q3:
        valores[
            Math.floor(
                valores.length * 0.75
            )
        ]

    };

}

// ======================================
// CORES NUMÉRICAS
// ======================================

function getColorQuartil(
    valor,
    quartis
){

    valor =
        parseFloat(
            String(valor)
            .replace(",",".")
        );

    if(isNaN(valor))
        return '#cccccc';

    return valor <= quartis.q1
        ? '#ffffcc'
        : valor <= quartis.q2
        ? '#a1dab4'
        : valor <= quartis.q3
        ? '#41b6c4'
        : '#225ea8';

}
function getColorAPS(valor){

    valor =
        parseFloat(
            String(valor)
            .replace(",",".")
        );

    if(isNaN(valor))
        return '#cccccc';

    if(valor < 60)
        return '#d73027';

    if(valor < 80)
        return '#fc8d59';

    if(valor < 90)
        return '#fee08b';

    if(valor < 95)
        return '#91bfdb';

    return '#1a9850';
function getColorAbandono(valor){

    valor =
        parseFloat(
            String(valor)
            .replace(",",".")
        );

    if(isNaN(valor))
        return '#cccccc';

    if(valor <= -20)
        return '#fee5d9';

    if(valor <= -10)
        return '#fcbba1';

    if(valor <= 0)
        return '#fb6a4a';

    if(valor <= 10)
        return '#de2d26';

    return '#a50f15';

}

// ======================================
// SCORES 1-3
// ======================================

function getColorScore(valor){

    valor =
        parseFloat(
            String(valor)
            .replace(",",".")
        );

    if(isNaN(valor))
        return '#cccccc';

    if(valor == 1)
        return '#fcbba1';

    if(valor == 2)
        return '#fb6a4a';

    if(valor == 3)
        return '#a50f15';

    return '#cccccc';

}
}
// ======================================
// CORES CATEGÓRICAS
// ======================================

function getColorCategoria(valor){

    const categorias =

        [...new Set(

            Object.values(indicadores)
            .map(
                d => d[indicadorAtual]
            )

        )];

    const paleta = [
    '#1f78b4','#33a02c','#e31a1c','#ff7f00','#6a3d9a',
    '#a6cee3','#b2df8a','#fb9a99','#fdbf6f','#cab2d6',
    '#ffff99','#b15928'
];

    const indice =
        categorias.indexOf(valor);

    return paleta[
        indice % paleta.length
    ];

}

// LEGENDA

function atualizarLegenda(){

    let html = '';

    if(
        indicadorAtual === 'DadosAPS_A' ||
        indicadorAtual === 'DadosAPS_S' ||
        indicadorAtual === 'DadosAPS_E'
    ){

        html += '<div class="item-legenda"><span class="cor" style="background:#d73027"></span><60%</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#fc8d59"></span>60-79%</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#fee08b"></span>80-89%</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#91bfdb"></span>90-94%</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#1a9850"></span>≥95%</div>';

    }

    else if(
        indicadorAtual === 'Abandono Vacinal'
    ){

        html += '<div class="item-legenda"><span class="cor" style="background:#fee5d9"></span>≤ -20</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#fcbba1"></span>-20 a -10</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#fb6a4a"></span>-10 a 0</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#de2d26"></span>0 a 10</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#a50f15"></span>> 10</div>';

    }

    else if(
        indicadorAtual === 'Score Taxa de Abandono' ||
        indicadorAtual === 'Score Bolsa Família'
    ){

        html += '<div class="item-legenda"><span class="cor" style="background:#fcbba1"></span>Score 1</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#fb6a4a"></span>Score 2</div>';
        html += '<div class="item-legenda"><span class="cor" style="background:#a50f15"></span>Score 3</div>';

    }

    else if(indicadorAtual === 'DadosAPS_F'){

        html = 'Faixas etárias';

    }

    else{

        html = 'Escala por quartis';

    }

    document
    .getElementById('legenda')
    .innerHTML = html;

}
// ======================================
// DESENHAR MAPA
// ======================================

function atualizarMapa(){

    if(!geojsonData)
        return;

    if(camadaUBS){

        map.removeLayer(
            camadaUBS
        );

    }

    const numerico =
        ehNumerico(
            indicadorAtual
        );

    const quartis =
        numerico
        ? calcularQuartis(
            indicadorAtual
        )
        : null;

    camadaUBS =
    L.geoJSON(
        geojsonData,
        {

            style:function(feature){

                const nome =
                    feature.properties.Name;

                const dado =
                    indicadores[nome];

                if(!dado){

                    return {

                        fillColor:'#cccccc',

                        fillOpacity:0.5,

                        color:'#333',

                        weight:1

                    };

                }

              let cor;

// Indicadores APS
if(
    indicadorAtual === 'DadosAPS_A' ||
    indicadorAtual === 'DadosAPS_S' ||
    indicadorAtual === 'DadosAPS_E'
){

    cor =
    getColorAPS(
        dado[indicadorAtual]
    );

}

// Abandono Vacinal
else if(
    indicadorAtual === 'Abandono Vacinal'
){

    cor =
    getColorAbandono(
        dado[indicadorAtual]
    );

}

// Scores
else if(
    indicadorAtual === 'Score Taxa de Abandono' ||
    indicadorAtual === 'Score Bolsa Família'
){

    cor =
    getColorScore(
        dado[indicadorAtual]
    );

}

// Indicadores numéricos gerais
else if(numerico){

    cor =
    getColorQuartil(
        dado[indicadorAtual],
        quartis
    );

}

// Variáveis categóricas
else{

    cor =
    getColorCategoria(
        dado[indicadorAtual]
    );

}
                         return {

                    fillColor:cor,

                    fillOpacity:0.7,

                    color:'#333',

                    weight:1

                };

            },

            onEachFeature:function(
                feature,
                layer
            ){

                const nome =
                    feature.properties.Name;

                const dado =
                    indicadores[nome];

                if(!dado)
                    return;

                let popup =
                    '<b>' +
                    nome +
                    '</b><hr>';

                Object.keys(
                    dado
                ).forEach(
                    campo => {

                        popup +=

                        '<b>' +

                        campo +

                        '</b>: ' +

                        dado[campo] +

                        '<br>';

                    }
                );

                layer.bindPopup(
                    popup
                );

            }

        }
    );

    camadaUBS.addTo(
        map
    );

    atualizarLegenda();

}

// ======================================
// GERAR SELETOR
// ======================================

function gerarSeletor(){

    const select =
    document.getElementById(
        'indicador'
    );

    select.innerHTML =
    '';

    const colunas =
        Object.keys(
            Object.values(
                indicadores
            )[0]
        );

    colunas.forEach(
        coluna => {

        if(
            coluna === 'Name'
        )
            return;

        const option =
        document.createElement(
            'option'
        );

        option.value =
        coluna;

        option.textContent =
        coluna;

        select.appendChild(
            option
        );

    });

    indicadorAtual =
        colunas.find(
            c => c !== 'Name'
        );

    select.value =
        indicadorAtual;

    select.onchange =
    function(){

        indicadorAtual =
            this.value;

        atualizarMapa();

    };

}

// ======================================
// CARREGAR DADOS DO SHEETS
// ======================================

function carregarDados(){

    Papa.parse(

        csvUrl +
        '&t=' +
        Date.now(),

        {

        download:true,

        header:true,

        complete:function(results){

            indicadores = {};

            results.data.forEach(row => {

                if(row.Name){

                    indicadores[
                        row.Name
                    ] = row;

                }

            });

            if(
                !indicadorAtual
            ){

                gerarSeletor();

            }

            atualizarMapa();

            console.log(
                'Dados atualizados:',
                new Date()
            );

        }

    });

}

// ======================================
// CARREGAR GEOJSON
// ======================================

fetch(
    geojsonUrl
)

.then(
response =>
response.json()
)

.then(
geojson => {

    geojsonData =
        geojson;

    carregarDados();

}
)

.catch(
erro => {

    console.error(
        'Erro GeoJSON:',
        erro
    );

}
);

// ======================================
// ATUALIZAÇÃO AUTOMÁTICA
// ======================================

setInterval(
    carregarDados,
    60000
);

</script>

</body>

</html>
