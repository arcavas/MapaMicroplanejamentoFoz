    <!DOCTYPE html>
    <html lang="pt-br">

    <head>

    <meta charset="utf-8">

    <title>Microplanejamento Vacinal - Foz do Iguaçu</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
    #legenda{

        margin-top:10px;

        background:white;

        padding:6px;

        border-radius:4px;

        font-size:12px;

        color:black;

        max-width:220px;

    }

    .item-legenda{

        margin-bottom:3px;

    }

    .cor{

        display:inline-block;

        width:14px;

        height:14px;

        margin-right:5px;

        border:1px solid #333;

    }

    html, body{
        margin:0;
        height:100%;
    }

    #map{
        height:100%;
    }

    #controle{

        position:absolute;

        top:10px;
        left:50px;

        z-index:1000;

        background:rgb(66, 79, 157);

        padding:10px;

        border-radius:5px;

        box-shadow:0 0 5px rgba(0,0,0,0.3);

    }

    #indicador{

        min-width:220px;

        font-size:14px;

        padding:5px;

    }

    </style>

    </head>

    <body>

    <div id="controle">

    <select id="indicador">
    <option>Carregando...</option>
    </select>

    <div id="legenda"></div>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>

    // ======================================
    // CONFIGURAÇÕES
    // ======================================

    const csvUrl =
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ83nMaB8cLLAZEwAicEhPeiuVPd89zsqMrS4T6-BtLNIYsH7LsU2jafFd4_OIDoULHl0Vv6raOBEG3/pub?gid=1960672355&single=true&output=csv';

    const geojsonUrl =
    'ubsmicroplanejamentogeojson_clean.geojson';

    // Nomes das colunas que recebem tratamento especial
    // (precisam bater exatamente com o cabeçalho da planilha)
    const INDICADOR_ABANDONO = 'Abandono Vacinal';
    const INDICADOR_FAIXA_ETARIA = 'Faixa etária';
    const INDICADORES_SCORE = ['Score Taxa de Abandono', 'Score Bolsa Família', 'Score avaliação];

    // Qualquer coluna cujo nome comece com "Cobertura" (ex: "Cobertura 2024",
    // "Cobertura 2025") usa a escala fixa de cobertura vacinal
    function ehIndicadorCobertura(indicador){
        return /^cobertura/i.test(
            String(indicador).trim()
        );
    }

    // ======================================
    // MAPA
    // ======================================

    const map =
    L.map('map').setView(
        [-25.54,-54.58],
        11
    );

    L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
    attribution:'© OpenStreetMap'
    }
    ).addTo(map);

    // ======================================
    // VARIÁVEIS GLOBAIS
    // ======================================

    let indicadores = {};

    let geojsonData = null;

    let camadaUBS = null;

    let indicadorAtual = null;

    let quartisAtual = null; // guarda os quartis calculados, usado pelo mapa e pela legenda

    let quartisAbandonoAtual = null; // quartis (calculados só com valores positivos) do Abandono Vacinal, usado pelo mapa e pela legenda

    // ======================================
    // IDENTIFICAR SE É NUMÉRICO
    // ======================================

    function ehNumerico(indicador){

        const primeiro =
            Object.values(indicadores)[0];

        if(!primeiro)
            return false;

        const valor =
            primeiro[indicador];

        return !isNaN(
            parseFloat(
                String(valor)
                .replace(",",".")
            )
        );

    }

    // ======================================
    // QUARTIS
    // ======================================

    function calcularQuartis(indicador){

        let valores = [];

        Object.values(indicadores)
        .forEach(row => {

            let valor =
                parseFloat(
                    String(
                        row[indicador]
                    ).replace(",",".")
                );

            if(!isNaN(valor))
                valores.push(valor);

        });

        valores.sort(
            (a,b)=>a-b
        );

        return {

            q1:
            valores[
                Math.floor(
                    valores.length * 0.25
                )
            ],

            q2:
            valores[
                Math.floor(
                    valores.length * 0.50
                )
            ],

            q3:
            valores[
                Math.floor(
                    valores.length * 0.75
                )
            ]

        };

    }

    // ======================================
    // CORES NUMÉRICAS GENÉRICAS (quartis, amarelo->azul)
    // usado para indicadores numéricos "neutros" como
    // Saneamento Básica, Esgoto, Bolsa família, Pop_IBGE_SMFI
    // ======================================

    function getColorQuartil(
        valor,
        quartis
    ){

        valor =
            parseFloat(
                String(valor)
                .replace(",",".")
            );

        if(isNaN(valor))
            return '#cccccc';

        return valor <= quartis.q1
            ? '#ffffcc'
            : valor <= quartis.q2
            ? '#a1dab4'
            : valor <= quartis.q3
            ? '#41b6c4'
            : '#225ea8';

    }

    // ======================================
    // ESCALA VERMELHA (menos vermelho -> mais vermelho)
    // usada no Abandono Vacinal (quartis) e nos Scores (valor fixo)
    // ======================================

    const ESCALA_VERMELHA = ['#fee5d9', '#fcae91', '#fb6a4a', '#a50f15'];

    // Abandono vacinal: 0 é o ponto de corte.
    // <= 0  -> não há abandono vacinal (cor neutra, fora da escala vermelha)
    // > 0   -> há abandono; a intensidade do vermelho segue quartis,
    //          calculados usando SOMENTE os valores positivos da planilha

    const COR_SEM_ABANDONO = '#ffffff'; // valor <= 0

    // Quartis calculados apenas com valores > 0 (negativos e zero não contam)
    function calcularQuartisPositivos(indicador){

        let valores = [];

        Object.values(indicadores)
        .forEach(row => {

            let valor =
                parseFloat(
                    String(row[indicador])
                    .replace(",",".")
                );

            if(!isNaN(valor) && valor > 0)
                valores.push(valor);

        });

        valores.sort(
            (a,b)=>a-b
        );

        return {

            q1:
            valores[
                Math.floor(
                    valores.length * 0.25
                )
            ],

            q2:
            valores[
                Math.floor(
                    valores.length * 0.50
                )
            ],

            q3:
            valores[
                Math.floor(
                    valores.length * 0.75
                )
            ]

        };

    }

    function getColorAbandono(valor, quartisPositivos){

        valor =
            parseFloat(
                String(valor)
                .replace(",",".")
            );

        if(isNaN(valor))
            return '#cccccc';

        // ponto de corte: aqui é onde a cor muda de fato
        if(valor <= 0)
            return COR_SEM_ABANDONO;

        if(!quartisPositivos)
            return ESCALA_VERMELHA[0];

        return valor <= quartisPositivos.q1
            ? ESCALA_VERMELHA[0]  // vermelho muito claro
            : valor <= quartisPositivos.q2
            ? ESCALA_VERMELHA[1]  // vermelho claro
            : valor <= quartisPositivos.q3
            ? ESCALA_VERMELHA[2]  // vermelho médio
            : ESCALA_VERMELHA[3]; // vermelho escuro

    }

    // Score 1-3: mapeamento direto, 3 é sempre o mais vermelho
    const CORES_SCORE = {
        '1': ESCALA_VERMELHA[0],
        '2': ESCALA_VERMELHA[2],
        '3': ESCALA_VERMELHA[3]
    };

    function getColorScore(valor){

        const chave =
            String(valor).trim();

        return CORES_SCORE[chave]
            || '#cccccc';

    }

    // ======================================
    // FAIXA ETÁRIA: escala sequencial ordenada pela idade
    // (mais tons do que a paleta categórica genérica)
    // ======================================

    const ORDEM_FAIXA_ETARIA = [
        '5-9','10-14','15-19','20-24','25-29',
        '30-34','35-39','40-44','45-49','50-54',
        '55-59','60-64'
    ];

    const ESCALA_FAIXA_ETARIA = [
        '#fff7fb','#ece7f2','#d0d1e6','#a6bddb',
        '#74a9cf','#3690c0','#0570b0','#045a8d',
        '#023858','#011830','#000c18','#000000'
    ];

    function getColorFaixaEtaria(valor){

        const indice =
            ORDEM_FAIXA_ETARIA.indexOf(valor);

        if(indice === -1)
            return '#cccccc';

        return ESCALA_FAIXA_ETARIA[
            indice % ESCALA_FAIXA_ETARIA.length
        ];

    }

    // ======================================
    // COBERTURA VACINAL: classes fixas (não são quartis)
    // 0 – 0,700 | 0,700 – 0,85 | 0,85 – 0,95 | 0,95 – 1 | 1 – 1,39
    // ======================================

    const CLASSES_COBERTURA = [
        { max: 0.700, cor: '#d73027', rotulo: '0 – 0,700'      },
        { max: 0.85,  cor: '#fc8d59', rotulo: '0,700 – 0,85'   },
        { max: 0.95,  cor: '#fee08b', rotulo: '0,85 – 0,95'    },
        { max: 1,     cor: '#91cf60', rotulo: '0,95 – 1'       },
        { max: 1.39,  cor: '#1a9850', rotulo: '1 – 1,39'       }
    ];

    function getColorCobertura(valor){

        valor =
            parseFloat(
                String(valor)
                .replace(",",".")
            );

        if(isNaN(valor))
            return '#cccccc';

        for(const classe of CLASSES_COBERTURA){
            if(valor <= classe.max)
                return classe.cor;
        }

        // acima de 1.39, mantém a cor da última classe
        return CLASSES_COBERTURA[
            CLASSES_COBERTURA.length - 1
        ].cor;

    }

    // ======================================
    // CORES CATEGÓRICAS GENÉRICAS (ex: Distrito)
    // ======================================

    function getColorCategoria(valor){

        const categorias =

            [...new Set(

                Object.values(indicadores)
                .map(
                    d => d[indicadorAtual]
                )

            )];

        const paleta = [
        '#1f78b4','#33a02c','#e31a1c','#ff7f00','#6a3d9a',
        '#a6cee3','#b2df8a','#fb9a99','#fdbf6f','#cab2d6',
        '#ffff99','#b15928'
    ];

        const indice =
            categorias.indexOf(valor);

        return paleta[
            indice % paleta.length
        ];

    }

    // ======================================
    // ROTEADOR DE COR: decide qual escala usar
    // de acordo com o indicador selecionado
    // ======================================

    function obterCor(dado){

        const valor =
            dado[indicadorAtual];

        if(ehIndicadorCobertura(indicadorAtual)){
            return getColorCobertura(valor);
        }

        if(INDICADORES_SCORE.includes(indicadorAtual)){
            return getColorScore(valor);
        }

        if(indicadorAtual === INDICADOR_ABANDONO){
            return getColorAbandono(valor, quartisAbandonoAtual);
        }

        if(indicadorAtual === INDICADOR_FAIXA_ETARIA){
            return getColorFaixaEtaria(valor);
        }

        if(ehNumerico(indicadorAtual)){
            return getColorQuartil(valor, quartisAtual);
        }

        return getColorCategoria(valor);

    }

    // ======================================
    // LEGENDA
    // ======================================

    function atualizarLegenda(){

        let html = '';

        if(ehIndicadorCobertura(indicadorAtual)){

            html += '<b>Cobertura vacinal</b><br>';

            CLASSES_COBERTURA.forEach(classe => {
                html +=
                    '<div class="item-legenda"><span class="cor" style="background:' +
                    classe.cor + '"></span>' + classe.rotulo + '</div>';
            });

        }

        else if(indicadorAtual === INDICADOR_ABANDONO){

            html += '<b>Abandono vacinal</b><br>';

            html +=
                '<div class="item-legenda"><span class="cor" style="background:' +
                COR_SEM_ABANDONO + '"></span>≤ 0 (sem abandono)</div>';

            const rotulos =
                quartisAbandonoAtual
                ? [
                    '≤ ' + quartisAbandonoAtual.q1.toFixed(2),
                    quartisAbandonoAtual.q1.toFixed(2) + ' – ' + quartisAbandonoAtual.q2.toFixed(2),
                    quartisAbandonoAtual.q2.toFixed(2) + ' – ' + quartisAbandonoAtual.q3.toFixed(2),
                    '> ' + quartisAbandonoAtual.q3.toFixed(2)
                ]
                : ['vermelho muito claro','vermelho claro','vermelho médio','vermelho escuro'];

            ESCALA_VERMELHA.forEach((cor, i) => {
                html +=
                    '<div class="item-legenda"><span class="cor" style="background:' +
                    cor + '"></span>' + rotulos[i] + '</div>';
            });

        }

        else if(INDICADORES_SCORE.includes(indicadorAtual)){

            html += '<b>Score (1 melhor, 3 pior)</b><br>';

            html += '<div class="item-legenda"><span class="cor" style="background:' + CORES_SCORE['1'] + '"></span>1 - melhor</div>';
            html += '<div class="item-legenda"><span class="cor" style="background:' + CORES_SCORE['2'] + '"></span>2</div>';
            html += '<div class="item-legenda"><span class="cor" style="background:' + CORES_SCORE['3'] + '"></span>3 - pior</div>';

        }

        else if(indicadorAtual === INDICADOR_FAIXA_ETARIA){

            html += '<b>Faixa etária predominante</b><br>';

            const presentes =
                ORDEM_FAIXA_ETARIA.filter(
                    faixa => Object.values(indicadores)
                        .some(d => d[indicadorAtual] === faixa)
                );

            presentes.forEach(faixa => {
                html +=
                    '<div class="item-legenda"><span class="cor" style="background:' +
                    getColorFaixaEtaria(faixa) + '"></span>' + faixa + '</div>';
            });

        }

        else if(ehNumerico(indicadorAtual)){

            html += '<b>Escala por quartis</b><br>';
            html += '<div class="item-legenda"><span class="cor" style="background:#ffffcc"></span>1º quartil</div>';
            html += '<div class="item-legenda"><span class="cor" style="background:#a1dab4"></span>2º quartil</div>';
            html += '<div class="item-legenda"><span class="cor" style="background:#41b6c4"></span>3º quartil</div>';
            html += '<div class="item-legenda"><span class="cor" style="background:#225ea8"></span>4º quartil</div>';

        }

        else{

            html += '<b>Categorias</b><br>';

            const categorias =
                [...new Set(
                    Object.values(indicadores)
                    .map(d => d[indicadorAtual])
                    .filter(Boolean)
                )];

            categorias.forEach(c => {
                html +=
                    '<div class="item-legenda"><span class="cor" style="background:' +
                    getColorCategoria(c) + '"></span>' + c + '</div>';
            });

        }

        document
        .getElementById('legenda')
        .innerHTML = html;

    }

    // ======================================
    // DESENHAR MAPA
    // ======================================

    function atualizarMapa(){

        if(!geojsonData)
            return;

        if(camadaUBS){

            map.removeLayer(
                camadaUBS
            );

        }

        const precisaQuartis =
            ehNumerico(indicadorAtual) &&
            indicadorAtual !== INDICADOR_ABANDONO &&
            !ehIndicadorCobertura(indicadorAtual) &&
            !INDICADORES_SCORE.includes(indicadorAtual);

        quartisAtual =
            precisaQuartis
            ? calcularQuartis(indicadorAtual)
            : null;

        quartisAbandonoAtual =
            indicadorAtual === INDICADOR_ABANDONO
            ? calcularQuartisPositivos(indicadorAtual)
            : null;

        camadaUBS =
        L.geoJSON(
            geojsonData,
            {

                style:function(feature){

                    const nome =
                        feature.properties.Name;

                    const dado =
                        indicadores[nome];

                    if(!dado){

                        return {

                            fillColor:'#cccccc',

                            fillOpacity:0.5,

                            color:'#333',

                            weight:1

                        };

                    }

                    return {

                        fillColor: obterCor(dado),

                        fillOpacity:0.7,

                        color:'#333',

                        weight:1

                    };

                },

                onEachFeature:function(
                    feature,
                    layer
                ){

                    const nome =
                        feature.properties.Name;

                    const dado =
                        indicadores[nome];

                    if(!dado)
                        return;

                    let popup =
                        '<b>' +
                        nome +
                        '</b><hr>';

                    Object.keys(
                        dado
                    ).forEach(
                        campo => {

                            popup +=

                            '<b>' +

                            campo +

                            '</b>: ' +

                            dado[campo] +

                            '<br>';

                        }
                    );

                    layer.bindPopup(
                        popup
                    );

                }

            }
        );

        camadaUBS.addTo(
            map
        );

        atualizarLegenda();

    }

    // ======================================
    // GERAR SELETOR
    // ======================================

    function gerarSeletor(){

        const select =
        document.getElementById(
            'indicador'
        );

        select.innerHTML =
        '';

        const colunas =
            Object.keys(
                Object.values(
                    indicadores
                )[0]
            );

        colunas.forEach(
            coluna => {

            if(
                coluna === 'Name'
            )
                return;

            const option =
            document.createElement(
                'option'
            );

            option.value =
            coluna;

            option.textContent =
            coluna;

            select.appendChild(
                option
            );

        });

        indicadorAtual =
            colunas.find(
                c => c !== 'Name'
            );

        select.value =
            indicadorAtual;

        select.onchange =
        function(){

            indicadorAtual =
                this.value;

            atualizarMapa();

        };

    }

    // ======================================
    // CARREGAR DADOS DO SHEETS
    // ======================================

    function carregarDados(){

        Papa.parse(

            csvUrl +
            '&t=' +
            Date.now(),

            {

            download:true,

            header:true,

            complete:function(results){

                indicadores = {};

                results.data.forEach(row => {

                    if(row.Name){

                        indicadores[
                            row.Name
                        ] = row;

                    }

                });

                if(
                    !indicadorAtual
                ){

                    gerarSeletor();

                }

                atualizarMapa();

                console.log(
                    'Dados atualizados:',
                    new Date()
                );

            }

        });

    }

    // ======================================
    // CARREGAR GEOJSON
    // ======================================

    fetch(
        geojsonUrl
    )

    .then(
    response =>
    response.json()
    )

    .then(
    geojson => {

        geojsonData =
            geojson;

        carregarDados();

    }
    )

    .catch(
    erro => {

        console.error(
            'Erro GeoJSON:',
            erro
        );

    }
    );

    // ======================================
    // ATUALIZAÇÃO AUTOMÁTICA
    // ======================================

    setInterval(
        carregarDados,
        60000
    );

    </script>

    </body>

    </html>
